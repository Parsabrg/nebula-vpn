include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Regenerated by third_party_src/vendor_plugin.py from an
    # upstream release; its own lint config is not ours to fix.
    - third_party/**
    # flutter gen-l10n output. Flutter 3.50's generator still names the
    # Material and Cupertino delegates it has itself deprecated.
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - windows/**
    - linux/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    directives_ordering: true
    prefer_final_locals: true
    sort_pub_dependencies: true
