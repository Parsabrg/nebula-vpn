name: Install

# install.sh on a fresh Ubuntu machine: a new install, then a rerun that must
# leave the configuration and every secret as they were. GitHub's runner is a
# whole VM (systemd, root, Docker); the certificate is self-signed and the
# names point here through /etc/hosts, so nothing outside is needed. Every
# protocol the server offers then has to carry traffic. --join needs a second
# machine and is not run here.
on:
  pull_request:
    paths:
      - "install.sh"
      - "infrastructure/**"
      - "services/vpn-agent/**"
      - "services/api/**"
      - "**/*.sh"
      - ".github/workflows/install.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "infrastructure/**"
      - "services/vpn-agent/**"
      - "services/api/**"
      - "**/*.sh"
      - ".github/workflows/install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

env:
  NEBULA_DOMAIN: nebula-ci.test
  NEBULA_ADMIN_EMAIL: ci@nebula-ci.test
  NEBULA_EMAIL_MODE: skip
  NEBULA_BACKUP_OFFSITE: local
  NEBULA_ASSUME_YES: "1"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  fresh-and-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Names and a self-signed certificate in place of DNS and certbot
        run: |
          set -eu
          ip=$(curl -4 -fsS -m 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          d=$NEBULA_DOMAIN
          # The runner's public address belongs to Azure's NAT; a server owns
          # its own. On loopback, connections to it stay on this machine.
          sudo ip address add "$ip/32" dev lo
          echo "$ip $d panel.$d api.$d" | sudo tee -a /etc/hosts
          a=/etc/letsencrypt/archive/panel.$d l=/etc/letsencrypt/live/panel.$d
          sudo mkdir -p "$a" "$l"
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 7 \
            -subj "/CN=panel.$d" -addext "subjectAltName=DNS:$d,DNS:panel.$d,DNS:api.$d" \
            -keyout "$a/privkey1.pem" -out "$a/fullchain1.pem"
          # Trusted here as Let's Encrypt's would be: the agent enrols over it.
          sudo cp "$a/fullchain1.pem" /usr/local/share/ca-certificates/nebula-ci.crt
          sudo update-ca-certificates >/dev/null
          sudo ln -s "../../archive/panel.$d/privkey1.pem" "$l/privkey.pem"
          sudo ln -s "../../archive/panel.$d/fullchain1.pem" "$l/fullchain.pem"
      - name: New install
        run: sudo -E ./install.sh </dev/null
      - name: Snapshot
        run: |
          sudo sh -c 'sha256sum /etc/nebula/*.env /etc/nebula/secrets/* /etc/wireguard/wg0.conf \
            /etc/ufw/before.rules /etc/nginx/sites-available/nebula' > /tmp/before.txt
          wc -l < /tmp/before.txt
      - name: Rerun
        run: sudo -E ./install.sh </dev/null
      - name: The rerun changed nothing
        run: |
          sudo sh -c 'sha256sum /etc/nebula/*.env /etc/nebula/secrets/* /etc/wireguard/wg0.conf \
            /etc/ufw/before.rules /etc/nginx/sites-available/nebula' > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt
      - name: Services are up
        run: |
          set -eu
          systemctl is-active nebula-vpn-agent nebula-xray nebula-hysteria wg-quick@wg0 nginx
          # Through nginx to the API, which asks for a session.
          code=$(curl -sS --cacert /etc/letsencrypt/live/panel.$NEBULA_DOMAIN/fullchain.pem -o /dev/null -w '%{http_code}' \
            --resolve api.$NEBULA_DOMAIN:8444:127.0.0.1 https://api.$NEBULA_DOMAIN:8444/v1/routes/)
          echo "API answered $code"; [ "$code" = 401 ]
          # A new install also serves the API and panel on 443, by name.
          for host in api panel; do
            code=$(curl -sS --cacert /etc/letsencrypt/live/panel.$NEBULA_DOMAIN/fullchain.pem -o /dev/null -w '%{http_code}' \
              --resolve $host.$NEBULA_DOMAIN:443:127.0.0.1 https://$host.$NEBULA_DOMAIN/v1/routes/)
            echo "$host on 443 answered $code"; [ "$code" != 000 ]
          done
          sudo grep -q '^NEBULA_XRAY_HYSTERIA_PORT=443$' /etc/nebula/agent.env
          # The tunnels' resolver answers where Xray's redirect sends them.
          sudo grep -qx 'NEBULA_XRAY_DNS_REDIRECT=198.18.0.53=127.0.0.1:5354' /etc/nebula/agent.env
          sudo grep -q 'nebula-xray -d 127.0.0.1/32 -p udp --dport 5354 -j ACCEPT' /etc/ufw/before.rules
          python3 - <<'PY'
          import socket
          q = bytes.fromhex("4e420100000100000000000000076578616d706c6503636f6d0000010001")
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(10)
          for _ in range(6):
              try:
                  s.sendto(q, ("127.0.0.1", 5354))
                  a = s.recv(512)
                  break
              except OSError:
                  continue
          else:
              raise SystemExit("the resolver on 127.0.0.1:5354 did not answer")
          assert a[:2] == q[:2] and a[7] > 0, "no answer for example.com"
          print("resolver answered example.com")
          PY
          # Metrics on the host's loopback only.
          curl -fsS http://127.0.0.1:8000/metrics | grep -q nebula_api_requests_total
          curl -fsS http://127.0.0.1:9464/metrics | grep -q nebula_agent_requests_total
          code=$(curl -sS --cacert /etc/letsencrypt/live/panel.$NEBULA_DOMAIN/fullchain.pem -o /dev/null -w '%{http_code}' \
            --resolve api.$NEBULA_DOMAIN:8444:127.0.0.1 https://api.$NEBULA_DOMAIN:8444/metrics)
          echo "metrics from outside: $code"; [ "$code" = 404 ]
      - name: Every protocol carries traffic
        # A credential per offered protocol through the agent, as when a device
        # connects, then a page fetched through the app's own client config.
        # WireGuard once had no address range on an enrolled server and carried
        # nothing while every service looked healthy (2026-10-31).
        # Xray 26.10 trusts only its own roots, so it is handed the CI certificate.
        run: sudo NEBULA_CHECK_CA=/usr/local/share/ca-certificates/nebula-ci.crt python3 infrastructure/check-protocols.py
      - name: Admin allowlist closes the panel and admin API, not the app's API
        run: |
          set -eu
          sudo -E env NEBULA_ADMIN_ALLOW=192.0.2.1 ./install.sh </dev/null >/dev/null
          get() { curl -sS --cacert /etc/letsencrypt/live/panel.$NEBULA_DOMAIN/fullchain.pem -o /dev/null -w '%{http_code}' \
            --resolve "$1.$NEBULA_DOMAIN:8444:127.0.0.1" "https://$1.$NEBULA_DOMAIN:8444$2"; }
          panel=$(get panel /) admin=$(get api /v1/admin/audit-log) app=$(get api /v1/routes/)
          echo "panel $panel, admin API $admin, app API $app"
          [ "$panel" = 403 ] && [ "$admin" = 403 ] && [ "$app" = 401 ]
      - name: Relay forwards only its ports, and comes off again
        run: |
          set -eu
          r=/etc/nebula/relay.env
          printf 'NEBULA_RELAY_TARGET=192.0.2.10\nNEBULA_RELAY_PORTS=2053/tcp:9443\n' | sudo tee $r >/dev/null
          if sudo -E ./install.sh </dev/null >/tmp/relay-bad.log 2>&1; then echo "forwarded the agent port"; exit 1; fi
          grep -q "never forwarded" /tmp/relay-bad.log
          printf 'NEBULA_RELAY_TARGET=192.0.2.10\nNEBULA_RELAY_PORTS=2053/tcp:8447 2053/udp:8450\nNEBULA_RELAY_CONNTRACK_MAX=200000\n' | sudo tee $r >/dev/null
          sudo -E ./install.sh </dev/null >/dev/null
          sudo iptables -t nat -S PREROUTING | grep -q -- "-p tcp .*--dport 2053 .*-j DNAT --to-destination 192.0.2.10:8447"
          sudo iptables -t nat -S PREROUTING | grep -q -- "-p udp .*--dport 2053 .*-j DNAT --to-destination 192.0.2.10:8450"
          [ "$(sudo iptables -S ufw-before-forward | grep -c nebula-relay)" = 2 ]
          ! sudo iptables -S | grep -q -- "-j LOG.*nebula-relay"
          [ "$(sysctl -n net.netfilter.nf_conntrack_max)" = 200000 ]
          sudo grep -qx NEBULA_RELAY_CHECK_TARGETS=192.0.2.10:8447 /etc/nebula/agent.env
          sudo sha256sum /etc/ufw/before.rules > /tmp/relay1.txt
          sudo -E ./install.sh </dev/null >/dev/null
          sudo sha256sum /etc/ufw/before.rules | diff /tmp/relay1.txt -
          sudo rm $r
          sudo -E ./install.sh </dev/null >/dev/null
          ! sudo iptables -t nat -S | grep -q 192.0.2.10
          ! sudo grep -q NEBULA_RELAY_CHECK_TARGETS /etc/nebula/agent.env
          systemctl is-active nebula-vpn-agent
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u nebula-vpn-agent -u nebula-xray --no-pager -n 60 || true
          sudo docker ps -a || true
          sudo sshd -T >/dev/null || echo "sshd -T exit $?"
